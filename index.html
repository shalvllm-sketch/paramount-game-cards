<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games near you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch:#0A1411;
    --pitch-2:#121F1A;
    --chalk:#F3F6F2;
    --mist:rgba(243,246,242,.58);
    --hair:rgba(243,246,242,.12);
    --away:#2B6E52;
    --home:#1F4E73;
    --r:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--pitch);
    color:var(--chalk);
    font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:stretch;justify-content:center;
    overflow:hidden;
  }

  /* yard markers: structure, not decoration */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      transparent 0 39px,
      rgba(243,246,242,.045) 39px 40px
    );
  }

  .stage{position:relative;width:100%;display:flex;flex-direction:column;min-height:0}

  .track{flex:1 1 auto;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
    scrollbar-width:none;-ms-overflow-style:none;min-height:0}
  .track::-webkit-scrollbar{display:none}

  .card{
    flex:0 0 100%;scroll-snap-align:center;
    display:flex;flex-direction:column;min-height:0;
    padding:10px 12px 0;
  }

  /* ---- matchup: the one bold element ---- */
  .match{
    position:relative;flex:1 1 auto;min-height:150px;
    border-radius:var(--r);overflow:hidden;isolation:isolate;
    background:var(--pitch-2);
  }
  .match .wash{position:absolute;inset:0;z-index:0}
  .wash.a{background:linear-gradient(145deg,var(--away) 0%,rgba(10,20,17,.1) 78%);
    clip-path:polygon(0 0,100% 0,0 100%)}
  .wash.b{background:linear-gradient(325deg,var(--home) 0%,rgba(10,20,17,.1) 78%);
    clip-path:polygon(100% 0,100% 100%,0 100%)}
  .seam{position:absolute;z-index:1;inset:0;
    background:linear-gradient(to bottom right,transparent calc(50% - .6px),rgba(243,246,242,.5) 50%,transparent calc(50% + .6px))}

  .side{position:absolute;z-index:2;display:flex;align-items:center;gap:9px;max-width:63%}
  .side.a{top:12px;left:12px}
  .side.b{bottom:12px;right:12px;flex-direction:row-reverse;text-align:right}
  .side img{width:46px;height:46px;object-fit:contain;flex:0 0 auto;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.55))}
  .side .nm{font-family:"Barlow Condensed",sans-serif;font-weight:700;
    font-size:21px;line-height:.98;letter-spacing:.01em;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  .side .role{font-size:10.5px;letter-spacing:.06em;color:rgba(243,246,242,.72);margin-top:3px}

  .at{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);
    font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:13px;
    color:rgba(10,20,17,.9);background:var(--chalk);border-radius:999px;
    padding:1px 10px 2px;box-shadow:0 2px 10px rgba(0,0,0,.4)}

  .live{position:absolute;z-index:3;top:11px;right:11px;
    font-size:10px;font-weight:600;letter-spacing:.07em;
    padding:3px 8px;border-radius:999px;border:1px solid var(--hair);
    background:rgba(10,20,17,.55);color:rgba(243,246,242,.8)}

  /* ---- kickoff block ---- */
  .info{flex:0 0 auto;padding:12px 2px 0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .when{font-family:"Barlow Condensed",sans-serif;font-weight:700;
    font-size:30px;line-height:1;letter-spacing:.005em}
  .on{font-size:12.5px;color:var(--mist);line-height:1.35}
  .venue{flex:0 0 auto;padding:5px 2px 0;font-size:12px;color:var(--mist)}
  .score{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:30px}

  .cta{flex:0 0 auto;margin:11px 0 0;display:block;width:100%;
    background:var(--chalk);color:#0A1411;border:0;border-radius:11px;
    padding:11px 14px;font-family:"Barlow",sans-serif;font-size:14px;font-weight:600;
    text-align:center;text-decoration:none;cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease}
  .cta:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.45)}
  .cta:active{transform:translateY(0)}

  /* ---- navigation ---- */
  .nav{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:12px;
    padding:10px 0 11px}
  .nav button{width:26px;height:26px;border-radius:50%;cursor:pointer;
    background:transparent;border:1px solid var(--hair);color:var(--chalk);
    font-size:13px;line-height:1;display:grid;place-items:center}
  .nav button:disabled{opacity:.3;cursor:default}
  .dots{display:flex;gap:6px}
  .dots i{width:6px;height:6px;border-radius:50%;background:rgba(243,246,242,.26)}
  .dots i.on{background:var(--chalk);width:17px;border-radius:3px}

  :focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
  .empty{margin:auto;padding:24px;text-align:center;color:var(--mist);font-size:13px}

  @media (prefers-reduced-motion:reduce){
    .track{scroll-behavior:auto}
    .cta{transition:none}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="track" id="track" tabindex="0" aria-label="Games available near you"></div>
  <div class="nav" id="nav" hidden>
    <button id="prev" aria-label="Previous game">&#8249;</button>
    <div class="dots" id="dots"></div>
    <button id="next" aria-label="Next game">&#8250;</button>
  </div>
</div>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var val = function (k) { return (q.get(k) || "").trim(); };

  /* Team colors, keyed by the ESPN logo code in the logo URL. */
  var COLORS = {
    ari:"#97233F", atl:"#A71930", bal:"#241773", buf:"#00338D", car:"#0085CA",
    chi:"#0B162A", cin:"#FB4F14", cle:"#311D00", dal:"#041E42", den:"#FB4F14",
    det:"#0076B6", gb:"#203731",  hou:"#03202F", ind:"#002C5F", jax:"#006778",
    kc:"#E31837",  lv:"#A5ACAF",  lac:"#0080C6", lar:"#003594", mia:"#008E97",
    min:"#4F2683", ne:"#002244",  no:"#D3BC8D",  nyg:"#0B2265", nyj:"#125740",
    phi:"#004C54", pit:"#FFB612", sf:"#AA0000",  sea:"#69BE28", tb:"#D50A0A",
    ten:"#4B92DB", wsh:"#5A1414"
  };

  /* Many NFL primaries are near-black and vanish on a dark field.
     Lift lightness and saturation so every matchup reads clearly. */
  function lift(hex) {
    var m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
    if (!m) return null;
    var n = parseInt(m[1], 16);
    var r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    var h = 0, s = 0, l = (mx + mn) / 2;
    if (d) {
      s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      if (mx === r) h = ((g - b) / d + (g < b ? 6 : 0));
      else if (mx === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    l = Math.min(Math.max(l, 0.34), 0.56);
    s = Math.min(Math.max(s, 0.34), 0.82);
    return "hsl(" + Math.round(h) + "," + Math.round(s * 100) + "%," + Math.round(l * 100) + "%)";
  }

  function codeFromLogo(url) {
    var m = /\/([a-z]{2,4})\.png/i.exec(url || "");
    return m ? m[1].toLowerCase() : "";
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  /* ---- read the cards out of the query string ---- */
  var count = parseInt(val("cards"), 10);
  if (!count || count < 1) count = 1;
  if (count > 10) count = 10;

  var games = [];
  for (var i = 1; i <= count; i++) {
    var g = {
      away: val("team1_" + i), home: val("team2_" + i),
      logoA: val("logo1_" + i), logoB: val("logo2_" + i),
      day: val("day_" + i), date: val("date_" + i), time: val("time_" + i),
      venue: val("venue_" + i), network: val("network_" + i), score: val("score_" + i),
      link: val("link_" + i) || val("link")
    };
    if (g.away || g.home) games.push(g);
  }

  var track = document.getElementById("track");

  if (!games.length) {
    track.appendChild(el("p", "empty", "No games to show yet."));
    return;
  }

  games.forEach(function (g) {
    var card = el("article", "card");

    var match = el("div", "match");
    var ca = lift(COLORS[codeFromLogo(g.logoA)]);
    var cb = lift(COLORS[codeFromLogo(g.logoB)]);
    if (ca) match.style.setProperty("--away", ca);
    if (cb) match.style.setProperty("--home", cb);

    match.appendChild(el("span", "wash a"));
    match.appendChild(el("span", "wash b"));
    match.appendChild(el("span", "seam"));

    [["a", g.away, g.logoA, "Away"], ["b", g.home, g.logoB, "Home"]].forEach(function (t) {
      var side = el("div", "side " + t[0]);
      if (t[2]) {
        var img = new Image();
        img.src = t[2]; img.alt = "";
        img.onerror = function () { img.remove(); };
        side.appendChild(img);
      }
      var box = el("div");
      box.appendChild(el("div", "nm", t[1] || "TBD"));
      box.appendChild(el("div", "role", t[3]));
      side.appendChild(box);
      match.appendChild(side);
    });

    match.appendChild(el("span", "at", "at"));
    if (g.score) match.appendChild(el("span", "live", "Final"));
    card.appendChild(match);

    var info = el("div", "info");
    if (g.score) {
      info.appendChild(el("span", "score", g.score));
    } else if (g.time) {
      info.appendChild(el("span", "when", g.time));
    }
    var whenText = [g.day, g.date].filter(Boolean).join(", ");
    if (whenText) info.appendChild(el("span", "on", whenText));
    if (info.childNodes.length) card.appendChild(info);

    if (g.venue) card.appendChild(el("div", "venue", g.venue));

    var label = g.network ? "Watch on " + g.network : "Watch now";
    if (g.link) {
      var a = el("a", "cta", label);
      a.href = g.link; a.target = "_blank"; a.rel = "noopener";
      card.appendChild(a);
    } else {
      card.appendChild(el("button", "cta", label));
    }

    track.appendChild(card);
  });

  /* ---- navigation ---- */
  if (games.length > 1) {
    var nav = document.getElementById("nav");
    var dots = document.getElementById("dots");
    var prev = document.getElementById("prev");
    var next = document.getElementById("next");
    nav.hidden = false;

    games.forEach(function () { dots.appendChild(el("i")); });

    var at = 0;
    function paint() {
      Array.prototype.forEach.call(dots.children, function (d, i) {
        d.className = i === at ? "on" : "";
      });
      prev.disabled = at === 0;
      next.disabled = at === games.length - 1;
    }
    function go(i) {
      at = Math.min(Math.max(i, 0), games.length - 1);
      track.scrollTo({ left: track.clientWidth * at, behavior: "smooth" });
      paint();
    }
    prev.onclick = function () { go(at - 1); };
    next.onclick = function () { go(at + 1); };
    track.addEventListener("scroll", function () {
      var i = Math.round(track.scrollLeft / track.clientWidth);
      if (i !== at) { at = i; paint(); }
    }, { passive: true });
    track.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight") { go(at + 1); e.preventDefault(); }
      if (e.key === "ArrowLeft") { go(at - 1); e.preventDefault(); }
    });
    paint();
  }
})();
</script>
</body>
</html>
