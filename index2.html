<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DraftKings Jackpocket Face-Off</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Teko:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  
  :root {
    --dk-green: #53b300;
    --dk-green-bright: #71dd00;
  }

  html, body {
    margin: 0; padding: 0; width: 100%;
    font-family: 'Montserrat', sans-serif;
    color: #fff;
    background: transparent;
    overflow-x: hidden;
  }

  #carousel-root {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 10px;
  }

  .pure-carousel { display: flex; flex-direction: column; width: 100%; }
  .radio-nav { display: none; }
  .viewport { overflow: hidden; border-radius: 16px; width: 100%; }
  .track { display: flex; transition: transform 0.4s ease; }
  .slide { padding: 0; height: 100%; flex-shrink: 0; }

  .match-card {
    background: #0f141e;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .card-header {
    background: linear-gradient(135deg, #131b29, #0d121c);
    padding: 12px 16px 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .header-top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0, 0, 0, 0.3);
    padding: 6px 12px;
    border-radius: 20px;
  }

  .brand-badge img {
    height: 16px;
    object-fit: contain;
  }

  /* Turns the black DK logo pure white */
  .brand-badge img.dk-logo {
    filter: brightness(0) invert(1);
    height: 14px;
  }

  .brand-title {
    font-family: 'Teko', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    line-height: 1;
    margin-top: 2px;
  }
  .brand-title span { color: var(--dk-green-bright); }

  .status-chip {
    background: rgba(83, 179, 0, 0.15);
    border: 1px solid var(--dk-green);
    color: var(--dk-green-bright);
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 0.65rem;
    font-weight: 800;
    text-transform: uppercase;
  }
  .status-chip.live {
    background: rgba(255, 59, 48, 0.15);
    border-color: #ff3b30;
    color: #ff453a;
  }

  .matchup {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
    margin-top: 16px;
    text-align: center;
  }

  .team-logo-ring {
    width: 56px; height: 56px;
    margin: 0 auto 6px;
    background: #1a2233;
    border-radius: 50%;
    padding: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid rgba(255, 255, 255, 0.1);
  }
  .team-logo-ring img { max-width: 100%; max-height: 100%; }

  .team-name {
    font-size: 0.85rem;
    font-weight: 800;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .team-tag { font-size: 0.65rem; color: #888; font-weight: 600; margin-top: 2px; }
  
  .vs-badge {
    background: #232c3d;
    color: var(--dk-green-bright);
    font-family: 'Teko', sans-serif;
    font-size: 1.1rem;
    padding: 2px 10px;
    border-radius: 4px;
    border: 1px solid var(--dk-green);
  }

  .card-body { padding: 16px; }

  .info-grid {
    background: rgba(255, 255, 255, 0.03);
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 12px;
    font-size: 0.75rem;
  }

  .info-row {
    display: flex;
    justify-content: space-between;
    margin: 4px 0;
  }
  .info-row .label { color: #aaa; }
  .info-row .val { font-weight: 800; }

  .cta-btn {
    display: block;
    width: 100%;
    background: var(--dk-green-bright);
    color: #000;
    text-align: center;
    padding: 12px;
    border-radius: 8px;
    font-weight: 800;
    text-transform: uppercase;
    text-decoration: none;
    font-size: 0.85rem;
  }

  .disclaimer {
    text-align: center;
    font-size: 0.6rem;
    color: #666;
    margin-top: 10px;
  }

  .nav-bar {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 12px 0 0;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="carousel-root"></div>

<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  function qs(name, fallback) { return params.get(name) || fallback; }
  function escapeHtml(val) { return String(val).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  
  // Real Image URLs for Branding
  var DK_LOGO = 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/DraftKings_logo.png/640px-DraftKings_logo.png';
  var JP_LOGO = 'https://is1-ssl.mzstatic.com/image/thumb/Purple116/v4/39/9f/bc/399fbc2a-c66c-5c2e-b419-d46fa1027dd6/AppIcon-1x_U007emarketing-0-7-0-85-220.png/1200x630wa.png'; 
  
  var cardsCount = Math.min(3, Math.max(1, parseInt(qs('cards', '1')) || 1));
  var games = [];

  for (var i = 1; i <= cardsCount; i++) {
    games.push({
      status: qs('status_' + i, 'UPCOMING'),
      venue: qs('venue_' + i, ''),
      broadcaster: qs('network_' + i, ''),
      watchUrl: qs('link_' + i, 'https://draftkings.com'),
      away: { name: qs('team1_' + i, 'AWAY'), logo: qs('logo1_' + i, '') },
      home: { name: qs('team2_' + i, 'HOME'), logo: qs('logo2_' + i, '') }
    });
  }

  function slideHTML(game) {
    var isLive = game.status.toUpperCase().includes('LIVE');
    var rows = '';
    if (game.venue) rows += '<div class="info-row"><span class="label">Venue</span><span class="val">' + escapeHtml(game.venue) + '</span></div>';
    if (game.broadcaster) rows += '<div class="info-row"><span class="label">Network</span><span class="val">' + escapeHtml(game.broadcaster) + '</span></div>';

    var awayLogo = game.away.logo ? '<img src="' + escapeHtml(game.away.logo) + '">' : escapeHtml(game.away.name.slice(0,2));
    var homeLogo = game.home.logo ? '<img src="' + escapeHtml(game.home.logo) + '">' : escapeHtml(game.home.name.slice(0,2));

    return '<div class="slide"><div class="match-card">' +
      '<div class="card-header">' +
        '<div class="header-top-row">' +
          '<div class="brand-badge">' +
            '<img src="' + DK_LOGO + '" class="dk-logo" alt="DK">' +
            '<img src="' + JP_LOGO + '" alt="JP">' +
            '<span class="brand-title">DRAFTKINGS <span>JACKPOCKET</span></span>' +
          '</div>' +
          '<div class="status-chip ' + (isLive ? 'live' : '') + '">' + escapeHtml(game.status) + '</div>' +
        '</div>' +
        '<div class="matchup">' +
          '<div class="team-block"><div class="team-logo-ring">' + awayLogo + '</div><div class="team-name">' + escapeHtml(game.away.name) + '</div><div class="team-tag">AWAY</div></div>' +
          '<div class="vs-badge">VS</div>' +
          '<div class="team-block"><div class="team-logo-ring">' + homeLogo + '</div><div class="team-name">' + escapeHtml(game.home.name) + '</div><div class="team-tag">HOME</div></div>' +
        '</div>' +
      '</div>' +
      '<div class="card-body">' +
        (rows ? '<div class="info-grid">' + rows + '</div>' : '') +
        '<a class="cta-btn" href="' + escapeHtml(game.watchUrl) + '" target="_blank">View on DraftKings</a>' +
        '<div class="disclaimer">21+. Physically present in legal state. Gambling problem? Call 1-800-GAMBLER.</div>' +
      '</div>' +
    '</div></div>';
  }

  function buildCSS(n) {
    var css = '.track { width: calc(' + n + ' * 100%); } .slide { flex: 0 0 calc(100% / ' + n + '); } ';
    for (var i = 0; i < n; i++) {
      css += '#g' + (i + 1) + ':checked ~ .viewport .track { transform: translateX(calc(-100% / ' + n + ' * ' + i + ')); } ';
      css += '#g' + (i + 1) + ':checked ~ .nav-bar label[for="g' + (i + 1) + '"] { background: var(--dk-green-bright); width: 16px; border-radius: 8px; } ';
    }
    return css;
  }

  function buildRadios(n) {
    var r = '';
    for (var i = 1; i <= n; i++) r += '<input type="radio" name="g" id="g' + i + '" class="radio-nav" ' + (i===1?'checked':'') + '>';
    return r;
  }
  function buildDots(n) {
    if (n <= 1) return '';
    var d = '<div class="nav-bar">';
    for (var i = 1; i <= n; i++) d += '<label for="g' + i + '" class="dot"></label>';
    return d + '</div>';
  }

  var st = document.createElement('style');
  st.innerHTML = buildCSS(cardsCount);
  document.head.appendChild(st);

  document.getElementById('carousel-root').innerHTML = 
    '<div class="pure-carousel">' + buildRadios(cardsCount) + 
    '<div class="viewport"><div class="track">' + games.map(slideHTML).join('') + '</div></div>' + 
    buildDots(cardsCount) + '</div>';

  // Dynamic Height for Netomi Widget
  var lastH = 0;
  function postHeight() {
    var root = document.getElementById('carousel-root');
    if(!root) return;
    var h = Math.ceil(root.getBoundingClientRect().height);
    if(h && Math.abs(h - lastH) > 2) {
      lastH = h;
      try { window.parent.postMessage({ eventType: 'UPDATE_PARENT_WINDOW_STYLE', data: { height: h + 'px' } }, '*'); } catch(e){}
    }
  }
  window.addEventListener('load', postHeight);
  if(window.ResizeObserver) new ResizeObserver(postHeight).observe(document.getElementById('carousel-root'));
  setTimeout(postHeight, 300);
})();
</script>

</body>
</html>
